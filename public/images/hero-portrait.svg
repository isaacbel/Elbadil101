<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5542"/>
      <stop offset="50%" stop-color="#1A4230"/>
      <stop offset="100%" stop-color="#123D2B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C94343" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E27373" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#5B8770" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#123D2B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#bg)" rx="32"/>
  <circle cx="300" cy="270" r="220" fill="url(#glow)"/>

  <!-- Subtle Geometric Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" fill="none">
    <circle cx="300" cy="300" r="160"/>
    <circle cx="300" cy="300" r="230"/>
    <path d="M 60,300 L 540,300 M 300,60 L 300,540"/>
    <polygon points="300,140 440,380 160,380"/>
  </g>

  <!-- Stylized Elegant Portrait Silhouette -->
  <g fill="#FAFAF7" fill-opacity="0.92">
    <!-- Head -->
    <path d="M 300 170 C 245 170, 235 225, 235 265 C 235 320, 260 360, 300 360 C 340 360, 365 320, 365 265 C 365 225, 355 170, 300 170 Z" fill="#D7E0D8"/>
    <!-- Shoulders & Torso -->
    <path d="M 300 380 C 220 380, 150 430, 120 540 C 110 575, 120 620, 130 650 L 470 650 C 480 620, 490 575, 480 540 C 450 430, 380 380, 300 380 Z" fill="#C4D1C6"/>
    <!-- Collar / Scarf Elegance -->
    <path d="M 270 380 L 300 450 L 330 380 Z" fill="#1D5B40"/>
    <path d="M 285 410 L 300 520 L 315 410 Z" fill="#123D2B"/>
  </g>

  <!-- Replacement Badge Box -->
  <rect x="50" y="660" width="500" height="58" rx="14" fill="#0C281C" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="300" y="686" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FAFAF7" text-anchor="middle" letter-spacing="1.5">
    OFFICIAL CANDIDATE PORTRAIT PLACEHOLDER
  </text>
  <text x="300" y="704" font-family="Inter, sans-serif" font-size="11" fill="#A8BFB2" text-anchor="middle">
    Replace with: public/images/hero-portrait.svg or .jpg (600x750)
  </text>
</svg>
